<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOIS UI Kit - Controles Extendidos</title>
    <style>
        :root {
            --bg-color: #6d6d6d;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --text-color: #ffffff;
            --active-bg: rgba(255, 255, 255, 0.2);
            --muted-text: rgba(255, 255, 255, 0.7);
            --accent: #ffffff;
            --shadow-strong: rgba(0, 0, 0, 0.35);
            --shadow-soft: rgba(0, 0, 0, 0.2);
            --font-main: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --panel-radius: 36px;
            --kit-max-width: 1200px;
            --kit-gap: clamp(16px, 2.4vw, 32px);
            --kit-pad: clamp(16px, 3vw, 36px);
            --kit-radius: 24px;
            --kit-card-radius: 20px;
            --kit-btn-radius: 999px;
            --kit-btn-pad-y: 12px;
            --kit-btn-pad-x: 28px;
            --kit-font-title: clamp(22px, 3vw, 36px);
            --kit-font-section: clamp(16px, 2.2vw, 20px);
            --kit-font-body: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        body {
            overflow: hidden;
        }

        .page {
            min-height: 100vh;
            width: 100%;
            overflow-y: auto;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #7a7a7a 0%, #4a4a4a 100%);
            z-index: -1;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--panel-radius);
            box-shadow: 0 14px 40px var(--shadow-strong);
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .kit-page {
            padding: clamp(24px, 4vw, 48px) clamp(16px, 4vw, 32px) 80px;
        }

        .kit-container {
            max-width: var(--kit-max-width);
            margin: 0 auto;
        }

        .kit-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: clamp(24px, 4vw, 48px);
            flex-wrap: wrap;
        }

        .kit-title {
            font-size: var(--kit-font-title);
            font-weight: 300;
            letter-spacing: 1px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
        }

        .kit-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: var(--kit-gap);
        }

        .kit-section {
            padding: var(--kit-pad);
            border-radius: var(--kit-radius);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .kit-section h2 {
            font-size: var(--kit-font-section);
            font-weight: 600;
            margin-bottom: 10px;
            text-align: center;
            opacity: 0.9;
        }

        /* D-PAD / CONTROL DE DIRECCIÓN */
        .dpad-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dpad-base {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            transform: rotate(45deg);
            border: 1px solid var(--glass-border);
        }

        .dpad-btn {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            transition: all 0.2s ease;
        }

        .dpad-btn:active {
            background: rgba(0, 0, 0, 0.1);
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4);
            transform: scale(0.95);
        }

        .dpad-up { top: 10px; }
        .dpad-down { bottom: 10px; }
        .dpad-left { left: 10px; }
        .dpad-right { right: 10px; }
        .dpad-ok { 
            position: relative; 
            width: 60px; 
            height: 60px; 
            border-radius: 50%; 
            font-weight: bold;
            background: rgba(255, 255, 255, 0.2);
        }

        /* MEDIA CONTROLS */
        .media-cluster {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .media-main {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(145deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05));
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .media-sub {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* STEPPERS (PLUS/MINUS) */
        .stepper {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: rgba(255,255,255,0.1);
            padding: 8px;
            border-radius: 25px;
            border: 1px solid var(--glass-border);
        }

        .step-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .step-btn:hover { background: rgba(255,255,255,0.2); }

        /* DIAL (ON/OFF) */
        .dial-container {
            display: flex;
            gap: 30px;
            justify-content: center;
        }

        .dial-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .dial {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.25), rgba(0,0,0,0.1));
            border: 1px solid var(--glass-border);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            cursor: pointer;
            position: relative;
        }

        .dial.active {
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.3), 0 5px 15px rgba(0,0,0,0.1);
            background: radial-gradient(circle at 70% 70%, rgba(255,255,255,0.15), rgba(0,0,0,0.05));
        }

        .dial::after {
            content: "";
            position: absolute;
            top: 15%;
            left: 50%;
            width: 4px;
            height: 15px;
            background: rgba(255,255,255,0.5);
            border-radius: 2px;
            transform: translateX(-50%);
        }

        .dial.active::after {
            top: auto;
            bottom: 15%;
            background: rgba(255,255,255,0.9);
        }

        svg { fill: white; width: 20px; height: 20px; }
    </style>
</head>
<body class="page kit-page">
    <div class="background"></div>
    <div class="kit-container fade-in">
        <header class="kit-header">
            <div>
                <h1 class="kit-title">Controles Neumórficos</h1>
                <p class="kit-subtitle">Interacciones táctiles con profundidad y realismo físico.</p>
            </div>
        </header>

        <div class="kit-grid">
            <!-- D-PAD SECCIÓN -->
            <section class="kit-section glass-panel">
                <h2>Control de Dirección</h2>
                <div class="dpad-container">
                    <div class="dpad-base"></div>
                    <button class="dpad-btn dpad-up" aria-label="Arriba"><svg viewBox="0 0 24 24"><path d="M7 14l5-5 5 5H7z"/></svg></button>
                    <button class="dpad-btn dpad-down" aria-label="Abajo"><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5H7z"/></svg></button>
                    <button class="dpad-btn dpad-left" aria-label="Izquierda"><svg viewBox="0 0 24 24"><path d="M14 7l-5 5 5 5V7z"/></svg></button>
                    <button class="dpad-btn dpad-right" aria-label="Derecha"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5v10z"/></svg></button>
                    <button class="dpad-btn dpad-ok">OK</button>
                </div>
            </section>

            <!-- MULTIMEDIA SECCIÓN -->
            <section class="kit-section glass-panel">
                <h2>Reproducción</h2>
                <div class="media-cluster">
                    <button class="media-sub" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                    <button class="media-main" aria-label="Reproducir">
                        <svg viewBox="0 0 24 24" style="width: 32px; height: 32px; margin-bottom: 4px;"><path d="M8 5v14l11-7z"/></svg>
                        <div style="width: 12px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px;"></div>
                    </button>
                    <button class="media-sub" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
                </div>
                <div style="display: flex; justify-content: space-around; margin-top: 10px;">
                    <div class="stepper">
                        <button class="step-btn">+</button>
                        <button class="step-btn">-</button>
                    </div>
                    <div class="stepper">
                        <button class="step-btn">+</button>
                        <button class="step-btn">-</button>
                    </div>
                </div>
            </section>

            <!-- DIALS SECCIÓN -->
            <section class="kit-section glass-panel">
                <h2>Interruptores de Disco</h2>
                <div class="dial-container">
                    <div class="dial-item">
                        <span style="font-size: 12px; font-weight: bold;">OFF</span>
                        <div class="dial" id="dial1"></div>
                    </div>
                    <div class="dial-item">
                        <span style="font-size: 12px; font-weight: bold; color: #fff;">ON</span>
                        <div class="dial active" id="dial2"></div>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; justify-content: center; margin-top: 10px;">
                    <div class="media-sub" style="width: 100px; border-radius: 20px;">Capsule</div>
                    <div class="media-sub" style="width: 100px; border-radius: 20px; background: rgba(0,0,0,0.1); box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);">Inset</div>
                </div>
            </section>
        </div>
    </div>

    <script>
        // Lógica para los Diales (ON/OFF)
        document.querySelectorAll('.dial').forEach(dial => {
            dial.addEventListener('click', () => {
                dial.classList.toggle('active');
                const label = dial.parentElement.querySelector('span');
                if (dial.classList.contains('active')) {
                    label.textContent = 'ON';
                } else {
                    label.textContent = 'OFF';
                }
            });
        });

        // Efecto visual de pulsación para botones genéricos
        document.querySelectorAll('.media-sub, .media-main, .step-btn').forEach(btn => {
            btn.addEventListener('mousedown', () => {
                btn.style.transform = 'scale(0.92)';
                btn.style.boxShadow = 'inset 0 2px 10px rgba(0,0,0,0.3)';
            });
            btn.addEventListener('mouseup', () => {
                btn.style.transform = 'scale(1)';
                btn.style.boxShadow = '';
            });
            btn.addEventListener('mouseleave', () => {
                btn.style.transform = 'scale(1)';
                btn.style.boxShadow = '';
            });
        });
    </script>
</body>
</html>
