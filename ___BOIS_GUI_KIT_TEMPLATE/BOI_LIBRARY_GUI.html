<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOIS UI Kit - B器IS_ character selector</title>
    <style>
        :root {
            --bg-color: #6d6d6d;
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.25);
            --text-color: #ffffff;
            --active-bg: rgba(255, 255, 255, 0.9);
            --active-text: #2b2b2b;
            --muted-text: rgba(255, 255, 255, 0.5);
            --accent: #ffffff;
            --shadow-strong: rgba(0, 0, 0, 0.4);
            --font-main: "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
            --panel-radius: 28px;
            --kit-pad: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #7a7a7a 0%, #3a3a3a 100%);
            z-index: -1;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px var(--shadow-strong);
        }

        .creator-layout {
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            height: 100%;
            padding: 40px;
            gap: 30px;
        }

        /* HEADER & TOOLBAR */
        .header-top {
            position: absolute;
            top: 40px;
            left: 40px;
            z-index: 10;
        }

        .header-top h1 {
            font-size: 22px;
            font-weight: 500;
            letter-spacing: -0.5px;
        }

        .header-top p {
            font-size: 13px;
            color: var(--muted-text);
            margin-top: 4px;
        }

        .toolbar-center {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            padding: 10px 20px;
            border-radius: 14px;
            z-index: 10;
        }

        .tool-btn {
            background: none;
            border: none;
            color: white;
            opacity: 0.5;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .tool-btn:hover { opacity: 1; }
        .tool-btn svg { width: 18px; height: 18px; fill: currentColor; }

        /* PANELS */
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 32px;
            padding: var(--kit-pad);
            border-radius: var(--panel-radius);
            height: 100%;
        }

        .group-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .label-technical {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--muted-text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .selector-btn {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            color: white;
        }

        .selector-btn svg { width: 20px; height: 20px; fill: currentColor; }

        .selector-btn:hover { background: rgba(255, 255, 255, 0.1); }

        .selector-btn.active {
            background: var(--active-bg);
            color: var(--active-text);
            border-color: var(--active-bg);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        /* PRESETS */
        .presets-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .presets-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .presets-grid::-webkit-scrollbar { width: 2px; }
        .presets-grid::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); }

        .preset-node {
            aspect-ratio: 1/1;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .preset-node:hover { border-color: rgba(255, 255, 255, 0.5); transform: scale(1.05); }

        .preset-node.active {
            border-color: var(--accent);
            border-width: 2px;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .preset-node.action {
            border-style: dashed;
            background: none;
        }

        .thumb-placeholder {
            width: 70%;
            height: 70%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        /* NAVIGATION */
        .nav-bar {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            padding: 6px;
            border-radius: 18px;
            z-index: 10;
        }

        .nav-link {
            padding: 10px 22px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--muted-text);
        }

        .nav-link.active {
            background: var(--active-bg);
            color: var(--active-text);
        }

        .complete-action {
            position: absolute;
            bottom: 40px;
            right: 40px;
            z-index: 10;
        }

        .btn-primary {
            background: #ffffff;
            color: #000000;
            padding: 14px 36px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn-primary:hover { transform: translateY(-2px); opacity: 0.9; }

        .character-preview {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="background"></div>

    <div class="header-top">
        <h1>B器IS Character Database</h1>
        <p>Selección de modelos y Configuración de parámetros de entidad visual.</p>
    </div>

    <nav class="toolbar-center glass-panel">
        <button class="tool-btn" title="Captura"><svg viewBox="0 0 24 24"><path d="M9 3L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-3.17L15 3H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg></button>
        <button class="tool-btn" title="Efectos"><svg viewBox="0 0 24 24"><path d="M7.5 5.6L10 7 8.6 4.5 10 2 7.5 3.4 5 2l1.4 2.5L5 7zm12 9.8l-2.5-1.4L14 15.4l1.4-2.5L14 10.4l2.5 1.4L19 10.4l-1.4 2.5L19 15.4zM19 2l-1.4 2.5L15 2l1.4 2.5L15 7l2.5-1.4L19 7l-1.4-2.5z"/></svg></button>
        <button class="tool-btn" title="Reset"><svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button>
    </nav>

    <main class="creator-layout">
        <aside class="side-panel glass-panel">
            <div class="group-container">
                <span class="label-technical">Perfil Genético</span>
                <span class="label-technical" style="font-size: 9px; margin-top: -12px;">Rango Etario</span>
                <div class="option-row">
                    <button class="selector-btn"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg></button>
                    <button class="selector-btn active"><svg viewBox="0 0 24 24"><path d="M12 6c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2m0 10c2.7 0 5.8 1.29 6 2H6c.23-.72 3.31-2 6-2"/></svg></button>
                    <button class="selector-btn"><svg viewBox="0 0 24 24"><path d="M12 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2m9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/></svg></button>
                </div>
            </div>

            <div class="group-container">
                <span class="label-technical">Identidad Genérica</span>
                <div class="option-row">
                    <button class="selector-btn" title="Masculino"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    <button class="selector-btn active" title="Femenino"><svg viewBox="0 0 24 24"><path d="M12 4c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2m0 16c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></button>
                </div>
            </div>

            <div class="group-container">
                <span class="label-technical">Módulos de Vestimenta</span>
                <div class="option-row">
                    <div class="selector-btn" style="width: 100%; border-radius: 12px; justify-content: flex-start; padding: 0 15px; gap: 12px;">
                        <svg viewBox="0 0 24 24"><path d="M7 13c1.66 0 3-1.34 3-3S8.66 7 7 7s-3 1.34-3 3 1.34 3 3 3zm10-6c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                        <span style="font-size: 11px; letter-spacing: 0.5px;">SUPERIOR</span>
                    </div>
                    <div class="selector-btn" style="width: 100%; border-radius: 12px; justify-content: flex-start; padding: 0 15px; gap: 12px;">
                        <svg viewBox="0 0 24 24"><path d="M21 2H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h7l-2 3v1h8v-1l-2-3h7c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                        <span style="font-size: 11px; letter-spacing: 0.5px;">INFERIOR</span>
                    </div>
                </div>
            </div>
        </aside>

        <section class="character-preview">
            <!-- Espacio para render 3D de B器IS_ -->
        </section>

        <aside class="side-panel glass-panel">
            <div class="presets-header">
                <span class="label-technical">B器IS_ PRESETS</span>
                <div style="display: flex; gap: 10px;">
                    <button class="tool-btn"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
                    <button class="tool-btn"><svg viewBox="0 0 24 24"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg></button>
                </div>
            </div>
            
            <div class="presets-grid">
                <div class="preset-node action">
                    <svg viewBox="0 0 24 24" style="width: 24px; opacity: 0.4;"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
                </div>
                <div class="preset-node active"><div class="thumb-placeholder"></div></div>
                <div class="preset-node"><div class="thumb-placeholder"></div></div>
                <div class="preset-node"><div class="thumb-placeholder"></div></div>
                <div class="preset-node"><div class="thumb-placeholder"></div></div>
                <div class="preset-node"><div class="thumb-placeholder"></div></div>
                <div class="preset-node"><div class="thumb-placeholder"></div></div>
                <div class="preset-node"><div class="thumb-placeholder"></div></div>
                <div class="preset-node"><div class="thumb-placeholder"></div></div>
                <div class="preset-node"><div class="thumb-placeholder"></div></div>
                <div class="preset-node"><div class="thumb-placeholder"></div></div>
                <div class="preset-node"><div class="thumb-placeholder"></div></div>
            </div>
        </aside>
    </main>

    <nav class="nav-bar glass-panel">
        <div class="nav-link active">Presets</div>
        <div class="nav-link">Fisonomía</div>
        <div class="nav-link">Estructura</div>
        <div class="nav-link">Outfit</div>
        <div class="nav-link">Módulos</div>
        <div class="nav-link">Sintetizar</div>
    </nav>

    <div class="complete-action">
        <button class="btn-primary">FINALIZAR PROCESO</button>
    </div>

    <script>
        // Navegación principal
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                link.classList.add('active');
            });
        });

        // Selección de opciones técnicas
        document.querySelectorAll('.selector-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const group = btn.parentElement;
                if (group.classList.contains('option-row')) {
                    group.querySelectorAll('.selector-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                }
            });
        });

        // Selección de presets
        document.querySelectorAll('.preset-node').forEach(node => {
            node.addEventListener('click', () => {
                if(!node.classList.contains('action')) {
                    document.querySelectorAll('.preset-node').forEach(n => n.classList.remove('active'));
                    node.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
